server:
  port: 8082

spring:
  application:
    name: property-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/estateiq_db}
    username: ${DATABASE_USERNAME:estateiq}
    password: ${DATABASE_PASSWORD:estateiq_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
