server:
  port: 8082

spring:
  application:
    name: property-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/estateiq_db}
    username: ${DATABASE_USERNAME:estateiq}
    password: ${DATABASE_PASSWORD:estateiq_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: property
    open-in-view: false
  flyway:
    enabled: true
    schemas: property
    default-schema: property
    table: flyway_schema_history
    create-schemas: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  cache:
    type: ${SPRING_CACHE_TYPE:simple}

estateiq:
  events:
    enabled: ${ESTATEIQ_EVENTS_ENABLED:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/estateiq}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
